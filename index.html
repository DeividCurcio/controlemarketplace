<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Pedidos — Entregas com Scanner</title>
  <meta name="theme-color" content="#f9fafb" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    .store-card { transition: transform 0.15s ease; }
    .store-card:active { transform: scale(0.98); }
    button, input { min-height: 44px; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app" class="max-w-5xl mx-auto px-3 py-4 pb-24 sm:px-6 sm:py-6 lg:py-8">

    <header class="text-center mb-6 sm:mb-8 sm:pt-2">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Entregas</h1>
      <p class="text-gray-500 mt-1">Controle de Pedidos com Scanner</p>
    </header>

    <!-- App Principal -->
    <div id="main-app">
      <p id="app-message" role="status" aria-live="polite" class="hidden"></p>
      <div class="mb-6">
        <p id="main-user-name" class="text-sm font-semibold">Modo local</p>
        <p class="text-xs text-gray-500">Dados salvos somente neste navegador · <span id="current-team" class="font-semibold">LOCAL</span></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
        <button onclick="showDailyReport()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-medium text-sm">📊 Relatório do Dia</button>
        <button onclick="exportToCSV()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-medium text-sm">📥 Exportar CSV</button>
      </div>

      <div class="bg-white rounded-3xl shadow-sm p-4 sm:p-5 mb-6">
        <h3 class="font-semibold text-gray-900 mb-3">Nova loja</h3>
        <div class="flex flex-col sm:flex-row gap-2">
          <input id="new-store" type="text" maxlength="80" placeholder="Nome da loja" class="min-w-0 flex-1 px-4 py-3.5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" />
          <button type="button" onclick="addStore()" aria-label="Adicionar loja" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 rounded-2xl font-semibold text-xl">+</button>
        </div>
      </div>

      <div id="stores-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>

      <!-- Modal Scanner -->
      <div id="scanner-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-4 sm:p-5 max-w-md w-full max-h-[90vh] overflow-y-auto">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-lg">Escanear Pedido</h3>
            <button onclick="closeScanner()" class="text-gray-400 text-3xl leading-none">&times;</button>
          </div>
          <div id="reader" class="rounded-2xl overflow-hidden bg-black"></div>
          <p id="scan-status" class="text-center text-sm text-gray-600 mt-4">Aponte a câmera para o código</p>
          <button onclick="closeScanner()" class="mt-5 w-full bg-gray-100 py-3.5 rounded-2xl font-medium">Fechar</button>
        </div>
      </div>

      <!-- Modal Relatório -->
      <div id="report-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-4 sm:p-5 max-w-md w-full max-h-[90vh] overflow-y-auto">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-lg">Relatório do Dia</h3>
            <button onclick="closeReport()" class="text-gray-400 text-3xl">&times;</button>
          </div>
          <div id="report-content" class="space-y-3 text-sm"></div>
          <button onclick="closeReport()" class="mt-5 w-full bg-gray-100 py-3.5 rounded-2xl">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TEAM_STORAGE_PREFIX = 'controle-pedidos:';
    const LOCAL_TEAM_CODE = 'LOCAL';

    let currentTeam = LOCAL_TEAM_CODE;
    const currentUser = { displayName: 'Usuário local', email: '', photoURL: '' };
    let stores = [];
    let html5QrCode = null;
    let scanningStoreId = null;
    let lastScanned = null;
    let lastScanTime = 0;

    function showAppMessage(msg, isError = true) {
      const el = document.getElementById('app-message');
      el.textContent = msg;
      el.className = msg ? `text-sm mb-4 ${isError ? 'text-red-600' : 'text-green-600'}` : 'hidden';
    }

    function getTeamStorageKey(teamCode) {
      return TEAM_STORAGE_PREFIX + encodeURIComponent(teamCode);
    }

    function enterTeam() {
      const code = LOCAL_TEAM_CODE;
      try {
        const savedStores = localStorage.getItem(getTeamStorageKey(code));
        if (savedStores === null) {
          const defaultStores = [
            { name: "Mercado Livre" },
            { name: "Shopee" },
            { name: "Shein" },
            { name: "Kwai" },
            { name: "Tik Tok" },
            { name: "Tik Tok J&T" },
            { name: "Temu" },
            { name: "Amazon" }
          ];
          stores = defaultStores.map((store, index) => ({
            id: (Date.now() + index).toString(),
            name: store.name,
            count: 0,
            orders: []
          }));
        } else {
          const parsedStores = JSON.parse(savedStores);
          if (!Array.isArray(parsedStores) || !parsedStores.every(store =>
            store &&
            typeof store.id === 'string' &&
            typeof store.name === 'string' &&
            Array.isArray(store.orders)
          )) {
            throw new Error('Formato dos dados locais inválido');
          }
          stores = parsedStores;
        }

        currentTeam = code;
        document.getElementById('current-team').textContent = code;
        showAppMessage('');
        renderStores();
        if (savedStores === null) saveStores();
      } catch (error) {
        showAppMessage('Não foi possível carregar os dados deste navegador. Confira o armazenamento local e tente novamente.');
        console.error('Falha ao carregar os dados locais:', error);
      }
    }

    window.addEventListener('DOMContentLoaded', enterTeam, { once: true });

    document.getElementById('stores-list').addEventListener('click', event => {
      if (!(event.target instanceof Element)) return;
      const button = event.target.closest('button[data-action]');
      if (!button) return;

      const action = button.dataset.action;
      const storeId = button.dataset.storeId;
      const actions = {
        delete: deleteStore,
        scan: openScanner,
        manual: manualAdd,
        reset: resetStore
      };
      if (storeId && actions[action]) actions[action](storeId);
    });

    function saveStores() {
      if (!currentTeam) return;
      try {
        localStorage.setItem(getTeamStorageKey(currentTeam), JSON.stringify(stores));
        showAppMessage('');
      } catch (error) {
        showAppMessage('Não foi possível salvar neste navegador. O armazenamento pode estar cheio ou bloqueado.');
        console.error('Falha ao salvar dados locais:', error);
      }
    }

    function addStore() {
      const input = document.getElementById('new-store');
      const name = input.value.trim().slice(0, 80);
      if (!name) return;
      const newId = Date.now().toString();
      stores.push({ id: newId, name, count: 0, orders: [] });
      input.value = '';
      saveStores();
    }

    function renderStores() {
      const container = document.getElementById('stores-list');
      if (!stores.length) {
        container.innerHTML = '<div class="text-center py-12 text-gray-400"><p>Nenhuma loja ainda</p></div>';
        return;
      }
      container.innerHTML = stores.map(store => `
        <div class="store-card bg-white rounded-3xl shadow-sm p-5">
          <div class="flex justify-between items-start gap-3">
            <div class="flex min-w-0 items-center gap-3">
              ${store.name === 'Mercado Livre' ? '<img src="https://play-lh.googleusercontent.com/iVaeA0HDw8CZjEM-K7GdLB9XYmpcwVFSuv4Q8o9uh4Br7PuKCm3QSYCVU73tr9BBXdR_7xTX4yO0azOJegRVcA" alt="Logo do Mercado Livre" class="h-10 w-10 shrink-0 rounded-lg object-contain" />' : store.name === 'Shopee' ? '<img src="shopee-logo.png" alt="Logo da Shopee" class="h-10 w-10 shrink-0 rounded-lg object-contain" />' : store.name === 'Shein' ? '<img src="shein-logo.webp" alt="Logo da Shein" class="h-10 w-10 shrink-0 rounded-lg object-contain" />' : ''}
              <div class="min-w-0">
                <h3 class="text-lg font-semibold">${escapeHtml(store.name)}</h3>
                <div class="mt-1 flex items-baseline gap-2">
                  <span class="text-5xl font-bold text-blue-600">${store.count || 0}</span>
                  <span class="text-sm text-gray-500">pedidos</span>
                </div>
              </div>
            </div>
            <button type="button" data-action="delete" data-store-id="${escapeHtml(store.id)}" class="shrink-0 text-sm text-red-500 px-2">Excluir</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2 mt-5">
            <button type="button" data-action="scan" data-store-id="${escapeHtml(store.id)}" class="bg-blue-600 text-white py-3.5 rounded-2xl font-medium">📷 Escanear</button>
            <button type="button" data-action="manual" data-store-id="${escapeHtml(store.id)}" class="px-5 bg-gray-100 rounded-2xl font-medium">+ Manual</button>
          </div>
          <button type="button" data-action="reset" data-store-id="${escapeHtml(store.id)}" class="mt-3 text-sm text-orange-600">Zerar contagem</button>
          ${store.orders && store.orders.length ? `
            <div class="mt-4 pt-4 border-t text-xs text-gray-500 max-h-32 overflow-y-auto">
              ${store.orders.slice(-5).reverse().map(o => `<div>${escapeHtml(o.code)} · ${escapeHtml(o.user)}</div>`).join('')}
            </div>` : ''}
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function openScanner(storeId) {
      scanningStoreId = storeId;
      document.getElementById('scanner-modal').classList.remove('hidden');
      document.getElementById('scanner-modal').classList.add('flex');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess, () => {});
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastScanned && now - lastScanTime < 1800) return;
      lastScanned = decodedText;
      lastScanTime = now;

      const store = stores.find(s => s.id === scanningStoreId);
      if (!store) return;
      if (!store.orders) store.orders = [];
      if (store.orders.some(o => o.code === decodedText)) {
        document.getElementById('scan-status').textContent = 'Já contado';
        return;
      }
      const userName = currentUser.displayName || (currentUser.email && currentUser.email.split('@')[0]) || 'Usuário';
      store.orders.push({ code: decodedText, time: now, user: userName });
      store.count = store.orders.length;
      saveStores();
      document.getElementById('scan-status').textContent = '✅ Contado: ' + decodedText;
    }

    function closeScanner() {
      if (html5QrCode) html5QrCode.stop().then(() => html5QrCode.clear());
      document.getElementById('scanner-modal').classList.add('hidden');
      document.getElementById('scanner-modal').classList.remove('flex');
    }

    function manualAdd(storeId) {
      const code = prompt('Código do pedido:');
      if (!code) return;
      const store = stores.find(s => s.id === storeId);
      if (!store) return;
      if (!store.orders) store.orders = [];
      if (store.orders.some(o => o.code === code.trim())) return alert('Já contado');
      const userName = currentUser.displayName || (currentUser.email && currentUser.email.split('@')[0]) || 'Usuário';
      store.orders.push({ code: code.trim(), time: Date.now(), user: userName });
      store.count = store.orders.length;
      saveStores();
    }

    function resetStore(storeId) {
      if (!confirm('Zerar?')) return;
      const store = stores.find(s => s.id === storeId);
      if (store) { store.count = 0; store.orders = []; saveStores(); }
    }

    function deleteStore(storeId) {
      if (!confirm('Excluir loja?')) return;
      stores = stores.filter(s => s.id !== storeId);
      saveStores();
    }

    function showDailyReport() {
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
      let total = 0;
      let html = `<p class="font-medium mb-3">Hoje: ${new Date().toLocaleDateString('pt-BR')}</p>`;
      stores.forEach(store => {
        const hoje = (store.orders || []).filter(o => new Date(o.time) >= todayStart && new Date(o.time) <= todayEnd);
        total += hoje.length;
        html += `<div class="bg-gray-50 p-3 rounded-2xl"><div class="flex justify-between font-semibold"><span>${escapeHtml(store.name)}</span><span class="text-blue-600">${hoje.length}</span></div></div>`;
      });
      html += `<div class="text-center font-bold text-lg mt-4">Total: ${total}</div>`;
      document.getElementById('report-content').innerHTML = html;
      document.getElementById('report-modal').classList.remove('hidden');
      document.getElementById('report-modal').classList.add('flex');
    }

    function closeReport() {
      document.getElementById('report-modal').classList.add('hidden');
      document.getElementById('report-modal').classList.remove('flex');
    }

    function exportToCSV() {
      let csv = 'Loja,Codigo,Data,Hora,Usuario\n';
      stores.forEach(store => {
        (store.orders || []).forEach(o => {
          const d = new Date(o.time);
          csv += `"${store.name}","${o.code}","${d.toLocaleDateString('pt-BR')}","${d.toLocaleTimeString('pt-BR')}","${o.user}"\n`;
        });
      });
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pedidos_${currentTeam}.csv`;
      a.click();
    }
  </script>
</body>
</html>
